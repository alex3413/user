server:
  port: 8090

uri:
  issuer: http://localhost:9000
  auth: http://localhost:9000
  host: localhost
  user-app: http://localhost:8080
  project-app: http://localhost:8090
  manifest-app: http://localhost:8091
  artifact-app: http://localhost:8092


spring:
  application:
    name: gateway
  security:
      oauth2:
        client:
          registration:
            gateway:
              provider: my-oidc-provider
              client-id: gateway
              client-secret: gateway-secret
              authorization-grant-type: authorization_code
              redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
              scope: openid
          provider:
            my-oidc-provider:
              authorization-uri: ${uri.auth}/oauth2/authorize
              token-uri: ${uri.auth}/oauth2/token
#              jwk-set-uri: ${uri.issuer}
              issuer-uri: ${uri.issuer}

  cloud:
     gateway:
       routes:
          - id: otus-user-app-registration
            uri: ${uri.user-app}
            order: 1
            predicates:
              - Host=${uri.host}
              - Path=/api/registration

          - id: otus-user-auth
            uri: ${uri.issuer}
            order: 1
            predicates:
              - Host=${uri.host}
              - Path=/auth

          - id: otus-user-app-api
            uri: ${uri.user-app}
            order: 2
            predicates:
              - Host=${uri.host}
              - Path=/api/user/**
            filters:
              - TokenRelay=
              - RemoveRequestHeader=Cookie

          - id: otus-project-app-api
            uri: ${uri.project-app}
            order: 2
            predicates:
              - Host=${uri.host}
              - Path=/api/project/**
            filters:
              - TokenRelay=
              - RemoveRequestHeader=Cookie

          - id: otus-manifest-app-api
            uri: ${uri.manifest-app}
            order: 2
            predicates:
              - Host=${uri.host}
              - Path=/api/project/**
            filters:
              - TokenRelay=
              - RemoveRequestHeader=Cookie

          - id: otus-artifact-app-api
            uri: ${uri.artifact-app}
            order: 2
            predicates:
              - Host=${uri.host}
              - Path=/api/project/**
            filters:
              - TokenRelay=
              - RemoveRequestHeader=Cookie