version: '3.9'

services:

  otus-user-service:
    build:
      context: ..
      dockerfile: ./docker/user.Dockerfile
    image: alexov3413/otus-user-app:v1.6
    ports:
      - "8080:8080"

  otus-audit-service:
    build:
      context: ..
      dockerfile: ./docker/audit.Dockerfile
    image: alexov3413/otus-audit-app:v1.6
    ports:
      - "8080:8080"

  otus-manifest-service:
    build:
      context: ..
      dockerfile: ./docker/manifest.Dockerfile
    image: alexov3413/otus-manifest-app:v1.6
    ports:
      - "8080:8080"

  otus-artifact-service:
    build:
      context: ..
      dockerfile: ./docker/artifact.Dockerfile
    image: alexov3413/otus-manifest-app:v1.6
    ports:
      - "8080:8080"

  otus-notification-service:
    build:
      context: ..
      dockerfile: ./docker/notification.Dockerfile
    image: alexov3413/otus-notification-app:v1.6
    ports:
      - "8080:8080"

  otus-project-service:
    build:
      context: ..
      dockerfile: ./docker/project.Dockerfile
    image: alexov3413/otus-project-app:v1.6
    ports:
      - "8080:8080"

  otus-auth-service:
    build:
      context: ..
      dockerfile: ./docker/auth.Dockerfile
    image: alexov3413/otus-auth-app:v1.6
    ports:
      - "9000:9000"

  otus-gateway-service:
    build:
      context: ..
      dockerfile: ./docker/gateway.Dockerfile
    image: alexov3413/otus-gateway-app:v1.6
    ports:
      - "8090:8090"

